version: '3.8'

services:
  xray:
    image: teddysun/xray:latest
    container_name: emergency_xray_core
    restart: always
    network_mode: "host"
    volumes:
      - ./xray-config.json:/etc/xray/config.json:ro

  rathole:
    image: rapiz1/rathole:latest
    container_name: emergency_rathole_client
    restart: always
    network_mode: "host"
    volumes:
      - ./rathole-client.toml:/app/config.toml:ro
    command: ["--client", "/app/config.toml"]
